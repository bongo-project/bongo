<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bongo Mail — Log In</title>
  <link rel="stylesheet" href="pico.min.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <h1>Bongo<span class="brand-accent">Mail</span></h1>
      <p>Your mail, your way</p>
    </div>

    <form>
      <label for="email">Email or username</label>
      <input type="text" id="email" name="email" value="admin" placeholder="you@example.com" autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="password123" placeholder="Enter your password">

      <div class="remember-row">
        <label style="display: flex; align-items: center; gap: 0.5rem; margin: 0; cursor: pointer;">
          <input type="checkbox" checked style="width: auto; margin: 0;">
          <span style="font-size: 0.88rem;">Remember me</span>
        </label>
        <a href="#" style="font-size: 0.85rem;">Forgot password?</a>
      </div>

      <label for="language" style="margin-top: 0.5rem;">Language</label>
      <select id="language" name="language" style="border: 1px solid var(--border-medium); border-radius: var(--radius-md); padding: 8px 14px; font-size: 0.95rem; margin-bottom: 0.5rem;">
        <option value="en" selected>English</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="fr">Francais</option>
        <option value="es">Espanol</option>
      </select>

      <button type="submit">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
      Bongo Mail Server v0.1.0
    </div>
  </div>
</body>
</html>
