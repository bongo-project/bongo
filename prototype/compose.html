<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bongo Mail — Compose</title>
  <link rel="stylesheet" href="pico.min.css">
  <link rel="stylesheet" href="shared.css">
  <script src="alpine.min.js" defer></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .compose-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .compose-card {
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface-0);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--surface-card);
      overflow: hidden;
    }
    .compose-header {
      padding: 1rem 1.5rem;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border-light);
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .compose-body { padding: 1.5rem; }
    .field-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-light);
    }
    .field-row:last-of-type { border-bottom: none; }
    .field-label {
      width: 4rem;
      text-align: right;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      padding-top: 8px;
      flex-shrink: 0;
    }
    .field-content {
      flex: 1;
      min-width: 0;
    }
    .field-content input {
      width: 100%;
      border: none;
      padding: 6px 0;
      font-size: 0.95rem;
      background: transparent;
      color: var(--text-primary);
      outline: none;
    }
    .chip-area {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      min-height: 36px;
    }
    .chip-area input {
      flex: 1;
      min-width: 120px;
    }
    .cc-toggle {
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 8px;
      flex-shrink: 0;
    }
    .cc-toggle:hover { color: var(--bongo-blue); }

    .compose-textarea {
      width: 100%;
      min-height: 24rem;
      border: none;
      padding: 1rem 0;
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.65;
      resize: vertical;
      background: transparent;
      color: var(--text-primary);
      outline: none;
    }

    .format-toolbar {
      display: flex;
      gap: 2px;
      padding: 6px 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 0.5rem;
    }
    .format-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .format-btn:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }
    .format-btn.active {
      background: var(--bongo-blue-lightest);
      color: var(--bongo-blue);
    }

    .compose-footer {
      padding: 1rem 1.5rem;
      background: var(--surface-1);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .compose-footer .spacer { flex: 1; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Top Bar -->
  <div class="top-bar" role="banner">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="index.html" class="brand">Bongo<span class="brand-accent">Mail</span></a>
    </div>
    <nav>
      <button class="theme-toggle" aria-label="Toggle theme" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">&#9789;</button>
      <a href="#">admin</a>
    </nav>
  </div>

  <div class="app-layout" style="height: calc(100vh - 48px);">
    <!-- Sidebar -->
    <aside class="sidebar" role="navigation" aria-label="Mail navigation">
      <a href="compose.html" class="compose-btn">+ Compose</a>
      <div class="sidebar-section">
        <h4>Mailboxes</h4>
        <ul class="mailbox-list">
          <li><a href="inbox.html">&#9993; Inbox <span class="unread-badge">12</span></a></li>
          <li><a href="#">&#9733; Starred</a></li>
          <li><a href="#">&#10148; Sent</a></li>
          <li><a href="#">&#9998; Drafts <span class="unread-badge">2</span></a></li>
          <li><a href="#">&#128465; Trash</a></li>
          <li><a href="#">&#9940; Spam</a></li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content" role="main" x-data="{ showCc: false, showBcc: false, files: [] }">
      <div class="compose-content">
        <div class="compose-card">
          <div class="compose-header">
            <span>New Message</span>
            <a href="inbox.html" style="color: var(--text-muted); text-decoration: none; font-size: 1.2rem;" title="Discard">&times;</a>
          </div>

          <div class="compose-body">
            <!-- To -->
            <div class="field-row">
              <span class="field-label">To</span>
              <div class="field-content">
                <div class="chip-area">
                  <span class="recipient-chip">sarah@example.com <span class="remove">&times;</span></span>
                  <input type="text" placeholder="Add recipients..." aria-label="To recipients">
                </div>
              </div>
              <span class="cc-toggle" @click="showCc = !showCc">Cc</span>
              <span class="cc-toggle" @click="showBcc = !showBcc">Bcc</span>
            </div>

            <!-- Cc (toggleable) -->
            <div class="field-row" x-show="showCc" x-cloak>
              <span class="field-label">Cc</span>
              <div class="field-content">
                <div class="chip-area">
                  <input type="text" placeholder="Add Cc..." aria-label="Cc recipients">
                </div>
              </div>
            </div>

            <!-- Bcc (toggleable) -->
            <div class="field-row" x-show="showBcc" x-cloak>
              <span class="field-label">Bcc</span>
              <div class="field-content">
                <div class="chip-area">
                  <input type="text" placeholder="Add Bcc..." aria-label="Bcc recipients">
                </div>
              </div>
            </div>

            <!-- Subject -->
            <div class="field-row">
              <span class="field-label">Subject</span>
              <div class="field-content">
                <input type="text" value="Re: Q1 Budget Review" aria-label="Subject">
              </div>
            </div>

            <!-- Format Toolbar -->
            <div class="format-toolbar">
              <button class="format-btn" title="Bold"><b>B</b></button>
              <button class="format-btn" title="Italic"><i>I</i></button>
              <button class="format-btn" title="Underline"><u>U</u></button>
              <button class="format-btn" title="Strikethrough"><s>S</s></button>
              <span style="width: 1px; height: 18px; background: var(--border-light); margin: 0 4px;"></span>
              <button class="format-btn" title="Bullet list">&#8226; List</button>
              <button class="format-btn" title="Numbered list">1. List</button>
              <span style="width: 1px; height: 18px; background: var(--border-light); margin: 0 4px;"></span>
              <button class="format-btn" title="Link">&#128279; Link</button>
              <button class="format-btn" title="Image">&#128247; Image</button>
            </div>

            <!-- Body -->
            <textarea class="compose-textarea" placeholder="Write your message..." aria-label="Message body">Hi Sarah,

Thanks for the updated numbers. The 8% ongoing increase is much better than the original 15% — great catch on splitting those out.

Thursday at 3pm works for me. I'll bring the comparison slides I've been working on.

One more thing — should we include the open-source tooling savings? We switched from Splunk to Loki which saves us roughly $8K/quarter.

Best regards</textarea>

            <!-- Drop zone for attachments -->
            <div class="drop-zone" x-on:dragover.prevent="$el.classList.add('drag-over')" x-on:dragleave="$el.classList.remove('drag-over')" x-on:drop.prevent="$el.classList.remove('drag-over')">
              <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">&#128206;</div>
              Drop files here or <a href="#" style="color: var(--bongo-blue);">browse</a>
            </div>
          </div>

          <div class="compose-footer">
            <button class="btn-send" style="background: var(--bongo-blue); color: #fff; border: none; padding: 8px 28px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 0.95rem;">Send</button>
            <button class="btn-secondary" style="background: transparent; border: 1px solid var(--border-medium); padding: 8px 16px; border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); font-size: 0.88rem;">Save Draft</button>
            <span class="spacer"></span>
            <button class="btn-secondary" style="background: transparent; border: 1px solid var(--border-medium); padding: 8px 16px; border-radius: var(--radius-md); cursor: pointer; color: var(--text-muted); font-size: 0.88rem;">Discard</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
