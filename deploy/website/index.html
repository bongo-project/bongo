<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bongo</title>
	<meta name="description" content="Bongo — a private mail and calendar server.">
	<style>
		:root { color-scheme: light dark; }
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: radial-gradient(120% 120% at 50% 0%, #1b2a4a 0%, #0c1220 60%, #070a12 100%);
			color: #e8ecf4;
			padding: 2rem;
			line-height: 1.6;
		}
		main { max-width: 34rem; text-align: center; }
		.mark {
			width: 72px; height: 72px; margin: 0 auto 1.5rem;
			border-radius: 20px;
			background: linear-gradient(135deg, #4f8cff, #7c5cff);
			display: grid; place-items: center;
			box-shadow: 0 12px 40px rgba(79, 140, 255, 0.35);
		}
		.mark svg { width: 38px; height: 38px; }
		h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
		p.lead { color: #aab6cc; font-size: 1.05rem; margin-bottom: 2rem; }
		a.cta {
			display: inline-block;
			padding: 0.8rem 1.6rem;
			border-radius: 12px;
			background: #4f8cff;
			color: #fff;
			text-decoration: none;
			font-weight: 600;
			transition: transform 0.15s ease, background 0.15s ease;
		}
		a.cta:hover { background: #3f7bfa; transform: translateY(-1px); }
		footer { margin-top: 3rem; color: #6b7a94; font-size: 0.85rem; }
	</style>
</head>
<body>
	<main>
		<div class="mark" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M3 7l9 6 9-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<rect x="3" y="5" width="18" height="14" rx="2" stroke="#fff" stroke-width="2"/>
			</svg>
		</div>
		<h1>Bongo</h1>
		<p class="lead">A private mail and calendar server.</p>
		<a class="cta" href="https://mail.example.com">Open webmail &rarr;</a>
		<footer>example.com</footer>
	</main>
</body>
</html>
