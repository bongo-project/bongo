syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

message QueueEnvelope {
  string id = 1;                         // Unique message ID (UUID)
  string sender = 2;                     // Envelope sender
  repeated string recipients = 3;        // Envelope recipients
  int64 received_at = 4;                 // Unix timestamp
  string source_ip = 5;                  // Connecting IP
  string blob_hash = 6;                  // Reference to blob store content
  uint32 flags = 7;                      // Processing flags (bitfield)
  string spf_result = 8;                 // From SMTP session
  repeated StageResult stages = 9;       // Results from completed stages
  string current_stage = 10;             // Stage currently processing
  string target_mailbox = 11;            // Override destination (set by rules/spam)
  repeated string pending_tags = 12;     // Tags to apply at delivery (accumulated by rules stage)
  repeated string forward_addresses = 13; // Legacy unattributed forwards; never sent (superseded by forward_requests)
  bool trusted = 14;                     // Message arrived authenticated or from trusted network
  string auth_user_id = 15;              // Authenticated submitter's user ID; empty for trusted-network or unauthenticated sources
  repeated ForwardRequest forward_requests = 16; // Forwards attributed to the owning user; enforced by the deliver stage
  uint32 pending_flags = 17;             // Mailbox flag bits (store.FlagSeen, store.FlagFlagged) the rules stage asks for
  repeated string copy_mailboxes = 18;   // Extra mailboxes a copy action asks for; each shares the message blob
  bool discard_normal = 19;              // A delete action won: skip the normal destination, still write copies and forwards
}

// ForwardRequest is one forward asked for by a rule, attributed to the user
// whose rule asked for it, so the deliver stage can check that user's verified
// targets and rate limit. Unattributed entries (user_id empty) are never sent.
message ForwardRequest {
  string user_id = 1;
  string target = 2;
}

message StageResult {
  string stage = 1;                      // "antispam", "antivirus", "rules"
  string backend = 2;                    // "builtin", "rspamd", "clamav"
  string action = 3;                     // "pass", "tag", "reject", "quarantine"
  float score = 4;                       // 0.0-1.0 for spam, 0/1 for virus
  repeated string reasons = 5;           // Human-readable reasons
  int64 processed_at = 6;               // Unix timestamp
  int32 duration_ms = 7;                // Processing time
  string dmarc_result = 8;              // "pass", "fail", "none", or "" if DMARC did not run
}
