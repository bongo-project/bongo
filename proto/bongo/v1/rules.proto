syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

message FilterRule {
  string id = 1;
  string name = 2;
  int32 priority = 3;            // lower = runs first
  bool enabled = 4;
  repeated Condition conditions = 5;
  FilterAction action = 6;       // first of actions; kept so an older node reads something sensible
  bool stop_processing = 7;      // skip remaining rules if matched
  int64 created_at = 8;
  int64 updated_at = 9;
  repeated FilterAction actions = 10; // 1 to 10 actions; empty means [action] (rules written before v0.14)
}

message Condition {
  string field = 1;              // "from", "to", "subject", "body", "header:X-List-Id", "size", "has_attachment"
  string operator = 2;           // "contains", "equals", "matches", "not_contains", "greater_than", "less_than"
  string value = 3;
}

message FilterAction {
  string type = 1;               // "move", "copy", "forward", "flag", "mark_read", "delete", "tag"
  string target = 2;             // folder name for move/copy, flag name for flag
  repeated string tags = 3;      // tag names to apply (used when type = "tag")
}
