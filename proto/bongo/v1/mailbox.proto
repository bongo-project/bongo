syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

// MailboxMeta stores per-mailbox metadata in Pebble.
//
// Design decision: message counts (total, recent, unseen) are intentionally
// NOT stored as proto fields. They are computed on demand via Pebble prefix
// scans in MailboxStore.CountMessages(). This avoids counter drift under
// concurrent Raft applies — multiple nodes applying log entries in parallel
// could cause stored counters to diverge from the actual message set.
// The prefix scan approach guarantees accuracy at the cost of an O(n) scan.
//
// If profiling shows prefix scans are too slow for large mailboxes, counters
// can be added as cached fields with invalidation on message insert/delete/flag.
message MailboxMeta {
  string name = 1;
  uint32 uid_validity = 2;
  uint32 uid_next = 3;

  // Subscription state is stored INVERTED on purpose: this is "unsubscribed",
  // not "subscribed". Do not "tidy" it into the positive form.
  //
  // Every mailbox written before this field existed decodes it as the proto3
  // zero value, false. False here means "still subscribed", so an upgrade
  // leaves every existing folder exactly as it behaved before and only an
  // explicit IMAP UNSUBSCRIBE changes anything. Stored positively, that same
  // zero value would read as "not subscribed" and silently unsubscribe every
  // folder of every user on upgrade — LSUB would go empty and clients would
  // stop showing mail.
  bool unsubscribed = 4;
}

message MailboxMessage {
  uint32 uid = 1;
  string mail_guid = 2;
  uint32 flags = 3;
  int64 internal_date = 4;
  repeated string tags = 5;  // denormalised from MailMeta for query speed
}
