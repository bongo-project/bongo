syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

import "proto/bongo/v1/blob.proto";

message MailMeta {
  string guid = 1;
  string message_id = 2;
  string subject = 3;
  string from = 4;
  repeated string to = 5;
  int64 received_at = 6;
  BlobRef raw_message = 7;
  repeated BlobRef attachments = 8;
  string folder_guid = 9;
  int32 flags = 10;
  string in_reply_to = 11;
  string references = 12;
  repeated string cc = 13;
  float spam_score = 14;       // 0.0 (ham) to 1.0 (spam)
  string spf_result = 15;      // "pass", "fail", "softfail", "neutral", "none"
  string dkim_result = 16;     // "pass", "fail", "none"
  string dkim_domain = 17;     // signing domain from d= tag
  string target_mailbox = 18;  // set by filter rules, empty = default routing
  repeated string tags = 19;   // tag names, lowercase, alphanumeric + hyphens

  // Attachment-dedup layout. When non-empty, this record is "split":
  // raw_message points at the skeleton blob (the concatenated literal spans), and
  // these segments describe how to interleave the skeleton's literal bytes with
  // the attachments[] blobs to rebuild the exact original RFC822 message. Empty
  // means a legacy whole-raw record: raw_message is the full message.
  repeated MessageSegment layout = 20;
}

// MessageSegment is one step in reconstructing a split message. Segments are
// applied in order: a LITERAL consumes `length` bytes from the skeleton blob
// (read sequentially); an ATTACHMENT splices in attachments[attachment_index].
message MessageSegment {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    LITERAL = 1;
    ATTACHMENT = 2;
  }
  Kind kind = 1;
  int64 length = 2;            // literal byte length (LITERAL segments)
  int32 attachment_index = 3;  // index into MailMeta.attachments (ATTACHMENT segments)
}
