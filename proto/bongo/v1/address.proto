syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

// AddressRecord stores metadata about a mail address in the global address index.
// Key: /system/address/{lowercased-address}
// Addresses are normalised to lowercase on write and on lookup.
message AddressRecord {
  // user_id is the owning user's ID.
  string user_id = 1;

  // domain is the domain part of the address (e.g. "example.com"), lowercased.
  string domain = 2;

  // kind classifies the address role: "primary", "alias", or "identity".
  string kind = 3;

  // can_send indicates the user may send outbound mail from this address.
  bool can_send = 4;

  // verified indicates the address ownership has been verified.
  bool verified = 5;
}

// AddressVerification stores a pending email verification challenge.
// Key: /user/{user_id}/addrverify/{lowercased-address}
// The plaintext code is NEVER stored — only a SHA-256 hash.
// Single-use: consumed on first successful verification.
message AddressVerification {
  // code_hash is the SHA-256 hash of the one-time verification code.
  // The plaintext code is sent by email and never stored.
  bytes code_hash = 1;

  // expires_at is a Unix timestamp after which this challenge is invalid.
  int64 expires_at = 2;

  // attempts is the number of failed verification attempts so far.
  // When it reaches maxVerifyAttempts the challenge is invalidated.
  int32 attempts = 3;
}

// ForwardTarget records the state of an external forwarding target for a user.
// Key: /user/{user_id}/fwdtarget/{lowercased-address}
// Challenges for pending targets live at /user/{user_id}/fwdverify/{address}
// and reuse AddressVerification. A target never grants send-as rights.
message ForwardTarget {
  // state is "pending", "verified" or "grandfathered". Only the last two allow
  // mail to be forwarded; grandfathered marks forwards that predate
  // verification and is reported to the operator at startup.
  string state = 1;
  int64 updated_at = 2;
}
