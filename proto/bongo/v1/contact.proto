syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

message Contact {
  string guid = 1;
  string display_name = 2;
  string email = 3;
  string phone = 4;
  string company = 5;
  string notes = 6;
  bytes vcard_raw = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  // addressbook_id names the address book the contact is filed in. Empty means
  // the default book.
  string addressbook_id = 12;
}
