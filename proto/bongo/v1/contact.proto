syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-go/bongo-go/proto/bongo/v1;bongov1";

message Contact {
  string guid = 1;
  string display_name = 2;
  string email = 3;
  string phone = 4;
  string company = 5;
  string notes = 6;
  bytes vcard_raw = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}
