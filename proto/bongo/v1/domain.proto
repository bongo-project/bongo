syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-go/bongo-go/proto/bongo/v1;bongov1";

// DomainRecord stores per-domain DKIM signing configuration.
// Stored under /system/domain/{domain}/dkim in Pebble.
// The existing /system/domain/{domain} key ("enabled"/"disabled" bytes) is
// intentionally left untouched to avoid a live-data migration.
message DomainRecord {
  // dkim_enabled indicates that outbound mail from this domain should be
  // signed with the key in dkim_private_key.
  bool dkim_enabled = 1;

  // dkim_selector is the DKIM DNS selector (e.g. "mail", "2024", ...).
  string dkim_selector = 2;

  // dkim_private_key holds the PEM-encoded RSA private key used for DKIM
  // signing. This field is secret: never log it.
  string dkim_private_key = 3;

  // owner_user_id is the user ID of the domain owner (tenant).
  // NOT stored inside the /dkim record — persisted separately at
  // /system/domain/{domain}/owner to avoid read-modify-write hazards with
  // DKIM key rotation. This field documents the schema; see DomainAdminStore.
  string owner_user_id = 4;
}

// DomainQuota holds per-domain resource limits.
// Stored under /system/domain/{domain}/quota in Pebble via Raft.
// 0 means unlimited for both fields.
message DomainQuota {
  // max_users is the maximum number of users whose primary domain is this
  // domain. 0 = unlimited.
  int64 max_users = 1;

  // max_storage_bytes is the maximum aggregate storage (sum of raw_message
  // blob sizes for all users in this domain). 0 = unlimited.
  int64 max_storage_bytes = 2;
}
