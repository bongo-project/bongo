syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

// AppPassword is one per-device protocol credential, stored at
// /user/{user_id}/apppassword/{id}. The id is the public lookup group of the
// password, so an authentication attempt compares exactly one hash.
message AppPassword {
  // id is the 6-letter lookup group; it is also the last key segment.
  string id = 1;
  // label is the user's name for the device.
  string label = 2;
  // created_at is unix seconds.
  int64 created_at = 3;
  // last_used_at is the unix time of 00:00 UTC on the last day the credential
  // authenticated. Zero means never used. Day granularity on purpose.
  int64 last_used_at = 4;
  // password_hash is the bcrypt hash of the 18-letter secret.
  bytes password_hash = 5;
}

// AppPasswordTicket is a one-time link that hands a phone a profile, stored at
// /user/{user_id}/devicelink/{hex(sha256(token))}. Only the hash of the token
// is in the key; the token itself is never stored or sent through Raft.
message AppPasswordTicket {
  // label is the name the user gave the device, checked when the link was made.
  string label = 1;
  // host is the server host name the profile advertises, resolved from the
  // desktop request. The phone's own request never chooses it.
  string host = 2;
  // epoch is the account's session epoch (security.SessionEpoch) when the link
  // was made. A password change moves it; a revoke-all does not, so RevokeAll deletes links itself.
  string epoch = 3;
  // created_at and expires_at are unix seconds.
  int64 created_at = 4;
  int64 expires_at = 5;
  // used_at is unix seconds of the redemption; zero means unused. The record
  // stays after use so the desktop can tell used from expired.
  int64 used_at = 6;
}
