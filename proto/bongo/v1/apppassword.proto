syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

// AppPassword is one per-device protocol credential, stored at
// /user/{user_id}/apppassword/{id}. The id is the public lookup group of the
// password, so an authentication attempt compares exactly one hash.
message AppPassword {
  // id is the 6-letter lookup group; it is also the last key segment.
  string id = 1;
  // label is the user's name for the device.
  string label = 2;
  // created_at is unix seconds.
  int64 created_at = 3;
  // last_used_at is the unix time of 00:00 UTC on the last day the credential
  // authenticated. Zero means never used. Day granularity on purpose.
  int64 last_used_at = 4;
  // password_hash is the bcrypt hash of the 18-letter secret.
  bytes password_hash = 5;
}
