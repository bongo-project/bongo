syntax = "proto3";

package bongo.v1;

option go_package = "github.com/bongo-project/bongo/proto/bongo/v1;bongov1";

message Calendar {
  string guid = 1;
  string name = 2;
  string description = 3;
  string color = 4;
  string timezone = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // shared_with is legacy. Grants live in the /acl/ key space (see acl.proto);
  // this field is read only by the calendar-grants-v1 migration, which then
  // clears it. Do not write it and do not reuse the number.
  repeated string shared_with = 8;
}
