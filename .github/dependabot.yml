version: 2
updates:
  # Workflow actions are pinned by commit SHA with a version comment; Dependabot
  # bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # deploy/Dockerfile base images (pinned by digest).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
  # Third-party images in deploy/docker-compose.yml. Each must carry a tag
  # alongside its digest or Dependabot cannot bump it.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
