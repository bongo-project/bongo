name: Release binaries

# Builds the standalone Linux zips (scripts/package-release.sh, the same as
# `make dist`) for a version tag and attaches them to a GitHub release whose
# notes are the annotated tag message. The container image is published
# separately by publish-image.yml.
on:
  push:
    tags:
      - "v*.*.*"
  # For a tag pushed before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, e.g. v0.13.1"
        required: true

permissions:
  contents: read

jobs:
  release:
    # GitHub-hosted on purpose, unlike the other workflows: the release
    # artefacts come from a clean runner, and the job needs gh and zip.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version tag: ${TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Same templ version as deploy/Dockerfile, so generated code matches.
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: Build zips
        run: scripts/package-release.sh "${TAG}"

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS

      # --notes-from-tag uses the annotated tag message as the release notes.
      # Re-running for a tag that already has a release replaces its assets.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" dist/*.zip dist/SHA256SUMS \
              --verify-tag --notes-from-tag --title "${TAG}"
          fi
