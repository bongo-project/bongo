name: CI

# `on: [push, pull_request]` ran this workflow TWICE for every branch that has
# an open PR -- once for each event, on the same commit -- doubling runner
# minutes and, because both runs compete for runners, slowing each of them down.
# Scoping push to main keeps a direct run on the default branch after a merge
# while branch pushes are covered by the pull_request event alone.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref: without this, pushing a fixup left
# the previous run going to completion alongside the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner choice: every job (here, deploy.yml and publish-image.yml) runs on
# the labels in the repository variable CI_RUNNER, a JSON list such as
# ["self-hosted","linux"], and on ubuntu-latest when it is unset. Switching
# between the self-hosted runner and GitHub's needs no code change.

# Read-only token for every job; none of them writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # golangci-lint does not check gofmt in this configuration, so formatting
      # drifted unnoticed to 25 files. This is the cheap gate that stops it.
      - run: make fmt-check
      # Every third-party image in the deploy template must be pinned by digest.
      # Here rather than in deploy.yml, which is path-filtered.
      - run: make check-image-pins
      # golangci-lint v2 (v1 binaries are built with an older Go and refuse to
      # analyse this module). Pinned to a version built with a new enough Go.
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  test:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -cover ./...

  security:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Both scanners are deliberately unpinned. This job CAN go red without a
      # code change - a new gosec rule, or a new advisory - and that is the
      # intended behaviour, not drift to be "fixed" by pinning.
      #
      # They catch different things. govulncheck queries the live Go
      # vulnerability database, so it reports new CVEs whether or not the binary
      # is pinned; most of what it flags is fixed by moving the go directive in
      # go.mod to a newer patch release. gosec is a static analyser, so @latest
      # buys new RULE classes rather than new CVEs.
      #
      # If a finding appears that you cannot reproduce locally, install the same
      # version before changing any code:
      #   go install github.com/securego/gosec/v2/cmd/gosec@latest
      # An older local copy silently lacks newer rules, and guessing at a fix
      # costs a CI round trip per attempt.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: govulncheck ./...
      - run: gosec -quiet -exclude-generated -severity=medium ./...

  integration:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -tags=integration ./test/integration/...

  build:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build -o bongo-go ./cmd/bongo-go
